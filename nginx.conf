# Nginx Configuration for DevOps App
# Save this as: /etc/nginx/sites-available/devops-app

upstream nodejs_app {
    server localhost:3000;
}

server {
    listen 80;
    listen [::]:80;
    
    server_name _;  # Replace with your domain: example.com www.example.com
    
    # Redirect HTTP to HTTPS (optional - requires SSL certificate)
    # return 301 https://$server_name$request_uri;
    
    location / {
        proxy_pass http://nodejs_app;
        proxy_http_version 1.1;
        
        # Headers for proper proxy communication
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Optional: Health check endpoint
    location /health {
        proxy_pass http://nodejs_app/health;
        access_log off;
    }
}

